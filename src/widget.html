<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eyes</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./widget.css" />
  </head>
  <body>
    <div class="widget">
      <div id="handle" class="handle" title="Drag to move · Double-click for a break">
        <div id="eyes" class="eyes"></div>
      </div>

      <div class="hud">
        <span id="time" class="time">20:00</span>
        <button id="pause" class="icon-btn" type="button" title="Pause">
          <svg id="icon-pause" viewBox="0 0 16 16" fill="currentColor">
            <rect x="4" y="3" width="2.6" height="10" rx="1" />
            <rect x="9.4" y="3" width="2.6" height="10" rx="1" />
          </svg>
          <svg id="icon-play" class="hidden" viewBox="0 0 16 16" fill="currentColor">
            <path d="M5 3.6v8.8a.6.6 0 0 0 .9.5l7-4.4a.6.6 0 0 0 0-1L5.9 3.1a.6.6 0 0 0-.9.5Z" />
          </svg>
        </button>
        <button id="break" class="icon-btn" type="button" title="Take a break">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M1.8 8.6C3.2 5.8 5.4 4.4 8 4.4s4.8 1.4 6.2 4.2" />
            <path d="M4.5 11.2c1 .7 2.2 1 3.5 1s2.5-.3 3.5-1" />
          </svg>
        </button>
        <button id="settings" class="icon-btn" type="button" title="Settings">
          <svg viewBox="0 0 16 16" fill="currentColor">
            <circle cx="3.5" cy="8" r="1.4" />
            <circle cx="8" cy="8" r="1.4" />
            <circle cx="12.5" cy="8" r="1.4" />
          </svg>
        </button>
      </div>
    </div>
    <script type="module" src="./widget.ts"></script>
  </body>
</html>
